<!-- Firebase -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  // ══════════════════════════════════════════════════
  // 🔥 FIREBASE CONFIG — আপনার নিজের config এখানে দিন
  // ══════════════════════════════════════════════════
  const firebaseConfig = {
    apiKey: "DEMO_MODE",
    authDomain: "gr-kg-school.firebaseapp.com",
    projectId: "gr-kg-school",
    storageBucket: "gr-kg-school.appspot.com",
    messagingSenderId: "000000000000",
    appId: "1:000000000000:web:000000000000000000"
  };

  // Demo mode — Firebase ছাড়াও কাজ করবে
  window.DB_READY = false;
  try {
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    window.firebaseDB = db;
    window.fbCollection = collection;
    window.fbAddDoc = addDoc;
    window.fbGetDocs = getDocs;
    window.fbDoc = doc;
    window.fbUpdateDoc = updateDoc;
    window.fbDeleteDoc = deleteDoc;
    window.fbQuery = query;
    window.fbOrderBy = orderBy;
    window.fbOnSnapshot = onSnapshot;
    window.DB_READY = true;
  } catch(e) {
    console.log("Running in demo mode");
  }
</script>

<style>
@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Playfair+Display:wght@700;900&display=swap');

:root {
  --green: #1a6b3c;
  --green-l: #22a05a;
  --green-pale: #e8f5ee;
  --red: #c0392b;
  --red-l: #e74c3c;
  --red-pale: #fdecea;
  --dark: #0f1f14;
  --mid: #1e3a26;
  --text: #1a2e1e;
  --text-l: #5a7a62;
  --white: #fff;
  --off: #f5f9f6;
  --border: #cde8d6;
  --orange: #e67e22;
  --blue: #2563eb;
  --shadow: 0 4px 20px rgba(26,107,60,0.10);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;font-family:'Hind Siliguri',sans-serif;background:var(--off);color:var(--text);}
::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--green-l);border-radius:99px;}

/* ── LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden;}
.sidebar{
  width:230px;min-width:230px;
  background:linear-gradient(180deg,var(--dark) 0%,var(--mid) 100%);
  display:flex;flex-direction:column;
  overflow-y:auto;overflow-x:hidden;
  position:relative;z-index:10;
}
.sidebar::before{
  content:'';position:absolute;top:-50px;right:-50px;
  width:160px;height:160px;border-radius:50%;
  background:radial-gradient(circle,rgba(34,160,90,0.2) 0%,transparent 70%);
  pointer-events:none;
}
.s-logo{padding:24px 20px 16px;border-bottom:1px solid rgba(255,255,255,0.08);}
.s-logo h1{font-family:'Playfair Display',serif;font-size:20px;font-weight:900;color:#fff;letter-spacing:1px;}
.s-logo h1 span{color:var(--green-l);}
.s-logo p{font-size:9px;color:rgba(255,255,255,0.35);margin-top:2px;letter-spacing:2px;text-transform:uppercase;}
.s-badge{
  margin:10px 20px;padding:6px 10px;border-radius:6px;
  background:rgba(34,160,90,0.15);border:1px solid rgba(34,160,90,0.3);
  font-size:10px;color:var(--green-l);letter-spacing:1px;
  display:flex;align-items:center;gap:6px;
}
.s-badge::before{content:'●';font-size:7px;color:#4ade80;}
.s-sec{padding:14px 18px 4px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,0.28);}
.nav-item{
  display:flex;align-items:center;gap:10px;
  padding:10px 20px;cursor:pointer;
  color:rgba(255,255,255,0.5);font-size:13px;
  transition:all .2s;position:relative;border:none;background:transparent;
  width:100%;text-align:left;font-family:'Hind Siliguri',sans-serif;
}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.05);}
.nav-item.active{
  color:#fff;
  background:linear-gradient(90deg,rgba(34,160,90,0.22) 0%,transparent 100%);
}
.nav-item.active::before{
  content:'';position:absolute;left:0;top:0;bottom:0;
  width:3px;background:var(--green-l);border-radius:0 2px 2px 0;
}
.nav-icon{font-size:15px;width:18px;text-align:center;}
.s-footer{margin-top:auto;padding:14px 18px;border-top:1px solid rgba(255,255,255,0.08);}
.user-pill{display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.06);border-radius:10px;}
.u-avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--green-l),var(--green));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.u-info p{font-size:12px;color:#fff;font-weight:500;}
.u-info small{font-size:10px;color:rgba(255,255,255,0.38);}

/* ── MAIN ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;}
.topbar{
  background:#fff;padding:14px 24px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-shrink:0;
}
.topbar h2{font-family:'Playfair Display',serif;font-size:18px;color:var(--text);}
.topbar p{font-size:11px;color:var(--text-l);margin-top:1px;}
.topbar-right{display:flex;align-items:center;gap:10px;}
.search-box{
  display:flex;align-items:center;gap:8px;
  background:var(--off);border:1px solid var(--border);
  border-radius:8px;padding:7px 12px;
}
.search-box input{border:none;background:transparent;outline:none;font-size:13px;font-family:'Hind Siliguri',sans-serif;color:var(--text);width:160px;}
.search-box input::placeholder{color:var(--text-l);}
.icon-btn{
  width:36px;height:36px;border-radius:8px;
  border:1px solid var(--border);background:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px;
  position:relative;transition:background .2s;
}
.icon-btn:hover{background:var(--green-pale);}
.notif-dot{position:absolute;top:6px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--red);border:1.5px solid #fff;}
.content{flex:1;overflow-y:auto;padding:22px 24px;}

/* ── CARDS ── */
.card{background:#fff;border-radius:14px;border:1px solid var(--border);overflow:hidden;}
.card-h{
  padding:14px 18px 12px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
}
.card-h h3{font-size:14px;font-weight:600;}
.card-h span{font-size:11px;color:var(--text-l);}
.card-b{padding:16px 18px;}

/* ── STATS ── */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px;}
.stat-card{
  background:#fff;border-radius:14px;padding:18px;
  border:1px solid var(--border);cursor:default;
  transition:transform .2s,box-shadow .2s;
}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
.stat-card.g{border-left:4px solid var(--green-l);}
.stat-card.r{border-left:4px solid var(--red);}
.stat-card.b{border-left:4px solid var(--blue);}
.stat-card.o{border-left:4px solid var(--orange);}
.stat-icon{font-size:22px;margin-bottom:8px;}
.stat-val{font-size:26px;font-weight:700;font-family:'Playfair Display',serif;color:var(--text);}
.stat-lbl{font-size:11px;color:var(--text-l);margin-top:1px;}
.stat-chg{font-size:10px;margin-top:5px;}
.stat-chg.up{color:var(--green-l);}.stat-chg.dn{color:var(--red);}

/* ── TABLE ── */
.tbl{width:100%;border-collapse:collapse;}
.tbl th{
  text-align:left;font-size:10px;letter-spacing:1px;text-transform:uppercase;
  color:var(--text-l);padding:8px 12px;background:var(--off);
}
.tbl td{padding:10px 12px;font-size:13px;border-bottom:1px solid var(--border);}
.tbl tr:last-child td{border-bottom:none;}
.tbl tr:hover td{background:var(--green-pale);}

/* ── BADGES ── */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;}
.badge.paid,.badge.present{background:var(--green-pale);color:var(--green);}
.badge.unpaid,.badge.absent{background:var(--red-pale);color:var(--red);}
.badge.partial{background:#fef3e2;color:#c97b2e;}

/* ── AVATAR ── */
.av{
  width:30px;height:30px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:#fff;flex-shrink:0;
}

/* ── GRID ── */
.g2{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-bottom:20px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px;}

/* ── NOTICE ── */
.notice-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border);}
.notice-item:last-child{border-bottom:none;}
.n-dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex-shrink:0;}
.notice-item h4{font-size:13px;font-weight:500;}
.notice-item p{font-size:11px;color:var(--text-l);margin-top:1px;}

/* ── ATTENDANCE BAR ── */
.att-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.att-lbl{font-size:11px;width:75px;color:var(--text-l);}
.att-bar{flex:1;height:7px;background:var(--border);border-radius:99px;overflow:hidden;}
.att-fill{height:100%;border-radius:99px;transition:width .6s ease;}
.att-pct{font-size:11px;font-weight:600;width:34px;text-align:right;}

/* ── QUICK ACTIONS ── */
.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.qa-btn{
  display:flex;align-items:center;gap:8px;
  padding:10px 12px;border-radius:9px;
  border:1.5px solid var(--border);background:var(--off);
  cursor:pointer;font-size:12px;font-weight:500;color:var(--text);
  font-family:'Hind Siliguri',sans-serif;transition:all .2s;
}
.qa-btn:hover{background:var(--green-pale);border-color:var(--green-l);color:var(--green);}

/* ── RING ── */
.ring-wrap{position:relative;display:inline-flex;align-items:center;justify-content:center;}
.ring-lbl{position:absolute;text-align:center;}
.ring-lbl .rv{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;color:var(--text);}
.ring-lbl .rl{font-size:9px;color:var(--text-l);}

/* ── FEE SUMMARY ── */
.fee-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px;}
.fee-box{padding:14px;border-radius:12px;text-align:center;}
.fee-box .fv{font-size:20px;font-weight:700;font-family:'Playfair Display',serif;}
.fee-box .fl{font-size:10px;margin-top:2px;}
.fee-box.ft{background:var(--green-pale);}.fee-box.ft .fv{color:var(--green);}
.fee-box.fc{background:#e8f0fe;}.fee-box.fc .fv{color:var(--blue);}
.fee-box.fd{background:var(--red-pale);}.fee-box.fd .fv{color:var(--red);}

/* ── TABS ── */
.tabs{display:flex;gap:3px;margin-bottom:16px;background:var(--off);padding:4px;border-radius:10px;width:fit-content;}
.tab-btn{
  padding:7px 14px;border-radius:7px;border:none;background:transparent;
  font-size:12px;cursor:pointer;color:var(--text-l);font-weight:400;
  transition:all .2s;font-family:'Hind Siliguri',sans-serif;
}
.tab-btn.active{background:#fff;color:var(--green);font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,0.07);}

/* ── BUTTONS ── */
.btn-p{
  background:linear-gradient(135deg,var(--green-l),var(--green));
  color:#fff;border:none;border-radius:9px;
  padding:9px 16px;font-size:13px;font-weight:500;
  cursor:pointer;font-family:'Hind Siliguri',sans-serif;
  display:inline-flex;align-items:center;gap:6px;transition:opacity .2s;
}
.btn-p:hover{opacity:.88;}
.btn-r{
  background:linear-gradient(135deg,var(--red-l),var(--red));
  color:#fff;border:none;border-radius:9px;
  padding:8px 14px;font-size:12px;font-weight:500;
  cursor:pointer;font-family:'Hind Siliguri',sans-serif;
}
.btn-ghost{
  padding:8px 14px;border:1.5px solid var(--border);
  border-radius:9px;background:#fff;font-size:12px;
  cursor:pointer;font-family:'Hind Siliguri',sans-serif;color:var(--text-l);
}

/* ── PAGE HEADER ── */
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.ph h2{font-family:'Playfair Display',serif;font-size:20px;}
.ph p{font-size:11px;color:var(--text-l);margin-top:2px;}

/* ── FILTER ── */
.filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.filter-chip{
  padding:6px 13px;border:1.5px solid var(--border);border-radius:20px;
  background:#fff;color:var(--text-l);font-size:12px;cursor:pointer;
  font-family:'Hind Siliguri',sans-serif;transition:all .2s;
}
.filter-chip.active{background:var(--green-pale);border-color:var(--green-l);color:var(--green);font-weight:600;}

/* ── MODAL ── */
.overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.45);
  display:flex;align-items:center;justify-content:center;z-index:999;
  animation:fadeIn .2s ease;
}
.modal{
  background:#fff;border-radius:16px;padding:26px;
  width:500px;max-width:95vw;max-height:88vh;overflow-y:auto;
  box-shadow:0 24px 60px rgba(0,0,0,0.18);
  animation:slideUp .25s ease;
}
.modal h3{font-family:'Playfair Display',serif;font-size:19px;margin-bottom:18px;color:var(--text);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:11px;}
.fg{margin-bottom:12px;}
.fg label{display:block;font-size:11px;font-weight:600;color:var(--text-l);margin-bottom:4px;letter-spacing:.3px;}
.fi{
  width:100%;padding:8px 11px;border:1.5px solid var(--border);
  border-radius:8px;font-family:'Hind Siliguri',sans-serif;font-size:13px;
  outline:none;color:var(--text);transition:border-color .2s;
}
.fi:focus{border-color:var(--green-l);}
textarea.fi{resize:vertical;min-height:70px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px;}

/* ── ANIMATIONS ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
.page{animation:fadeIn .3s ease;}

/* ── TOAST ── */
.toast{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  background:var(--dark);color:#fff;
  padding:12px 18px;border-radius:10px;font-size:13px;
  box-shadow:0 8px 24px rgba(0,0,0,0.3);
  animation:slideUp .3s ease;
  display:flex;align-items:center;gap:8px;
}
.toast.success::before{content:'✅';}
.toast.error::before{content:'❌';}

/* ── RESPONSIVE ── */
@media(max-width:768px){
  .sidebar{width:60px;min-width:60px;}
  .s-logo p,.s-logo h1,.nav-item span:last-child,.u-info,.s-sec,.s-badge{display:none;}
  .nav-item{justify-content:center;padding:12px;}
  .stats-grid{grid-template-columns:repeat(2,1fr);}
  .g2,.g3{grid-template-columns:1fr;}
  .form-row{grid-template-columns:1fr;}
  .topbar h2{font-size:15px;}
  .content{padding:14px;}
  .fee-sum{grid-template-columns:1fr;}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr 1fr;}
  .topbar{padding:10px 14px;}
  .search-box{display:none;}
}

/* ── RESULT CARD ── */
.result-badge{
  display:inline-block;padding:4px 12px;border-radius:20px;
  font-size:12px;font-weight:700;
}

/* ── SALARY ── */
.progress-sm{height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin-top:4px;}
.progress-sm div{height:100%;border-radius:99px;}

/* ── ROUTINE ── */
.routine-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;}
.r-cell{padding:10px 8px;border-radius:10px;text-align:center;border:1px solid var(--border);}
.r-cell.h{background:var(--dark);color:#fff;font-weight:600;font-size:11px;}
.r-cell .r-sub{font-size:12px;font-weight:600;color:var(--green);}
.r-cell .r-tchr{font-size:10px;color:var(--text-l);margin-top:2px;}
.r-cell .r-time{font-size:9px;color:var(--text-l);}

</style>

<script>
// ══════════════════════════════════════════════════
// LOCAL STORAGE DATABASE (Firebase fallback)
// ══════════════════════════════════════════════════
const LS = {
  get(k){try{return JSON.parse(localStorage.getItem(k)||'null')}catch{return null}},
  set(k,v){localStorage.setItem(k,JSON.stringify(v))},
  push(k,v){const a=LS.get(k)||[];v.id=v.id||'id_'+Date.now();a.push(v);LS.set(k,a);return v},
  update(k,id,patch){const a=LS.get(k)||[];const i=a.findIndex(x=>x.id===id);if(i>=0){a[i]={...a[i],...patch};LS.set(k,a);}},
  delete(k,id){const a=(LS.get(k)||[]).filter(x=>x.id!==id);LS.set(k,a);}
};

// ══════════════════════════════════════════════════
// SEED DATA (first run)
// ══════════════════════════════════════════════════
function seedData(){
  if(LS.get('seeded')) return;
  const students=[
    {id:'GR-001',name:'Ayaan Khan',cls:'Class 5',section:'A',roll:'05',blood:'B+',guardian:'Mr. Imran Khan',phone:'01712345678',fee:'paid',month:'Feb 2026'},
    {id:'GR-002',name:'Zara Malik',cls:'Class 7',section:'B',roll:'12',blood:'O+',guardian:'Mrs. Sana Malik',phone:'01898765432',fee:'unpaid',month:'Feb 2026'},

const AV_COLORS=['#22a05a','#c0392b','#2563eb','#e67e22','#8b5cf6','#0891b2'];
function avColor(i){return AV_COLORS[i%AV_COLORS.length];}
function initials(name){return name.split(' ').map(x=>x[0]).join('').substring(0,2).toUpperCase();}
function avHTML(name,i,size=30){
  return `<div class="av" style="background:${avColor(i)};width:${size}px;height:${size}px;font-size:${size<30?10:12}px">${initials(name)}</div>`;
}

function toast(msg,type='success'){
  const t=document.createElement('div');
  t.className=`toast ${type}`;t.textContent=msg;
  document.getElementById('toast-root').appendChild(t);
  setTimeout(()=>t.remove(),3000);
}

const PAGE_INFO={
  dashboard:{title:'Admin Dashboard',sub:'GR-KG School Management System'},
  students:{title:'Student Database',sub:'Nursery to Class 10'},
  teachers:{title:'Teachers & Staff',sub:'Manage faculty information'},
  attendance:{title:'Digital Attendance',sub:'Daily attendance tracking'},
  results:{title:'Results & Marksheet',sub:'Academic performance records'},
  fees:{title:'Financial Module',sub:'Fee & salary management'},
  routine:{title:'Class Routine',sub:'Weekly schedule'},
  notices:{title:'Notice Board',sub:'Announcements & alerts'},
  settings:{title:'Settings',sub:'System configuration'},
};
let currentPage='dashboard';

function navigate(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  const info=PAGE_INFO[page]||{title:page,sub:''};
  document.getElementById('page-title').textContent=info.title;
  document.getElementById('page-sub').textContent=info.sub;
  const c=document.getElementById('content');
  c.innerHTML='';
  const p=document.createElement('div');
  p.className='page';
  const renderer=PAGES[page];
  if(renderer) renderer(p);
  else p.innerHTML=`<div class="card card-b" style="padding:40px;text-align:center;color:var(--text-l)">Page coming soon…</div>`;
  c.appendChild(p);
  closeModal();
}

document.querySelectorAll('.nav-item[data-page]').forEach(b=>{
  b.addEventListener('click',()=>navigate(b.dataset.page));
});

function renderStudents(el){
  let filter='All';
  const classes=['All','Nursery','KG','Class 1','Class 2','Class 3','Class 4','Class 5','Class 6','Class 7','Class 8','Class 9','Class 10'];

  function draw(){
    const students=LS.get('students')||[];
    const q=document.getElementById('search-input')?.value?.toLowerCase()||'';
    const filtered=students.filter(s=>{
      const matchClass=filter==='All'||s.cls===filter;
      const matchSearch=!q||s.name.toLowerCase().includes(q)||s.id.toLowerCase().includes(q)||s.guardian.toLowerCase().includes(q);
      return matchClass&&matchSearch;
    });

    el.innerHTML=`
    <div class="ph">
      <div><h2>Student Database</h2><p>${students.length} জন শিক্ষার্থী নথিভুক্ত</p></div>
      <button class="btn-p" onclick="showAddStudent()">➕ শিক্ষার্থী যোগ করুন</button>
    </div>
    <div class="filter-bar">
      ${classes.map(c=>`<button class="filter-chip ${filter===c?'active':''}" onclick="setClassFilter('${c}')">${c}</button>`).join('')}
    </div>
    <div class="card">
      <table class="tbl">
        <thead><tr><th>শিক্ষার্থী</th><th>আইডি</th><th>শ্রেণী/সেকশন</th><th>রোল</th><th>রক্তের গ্রুপ</th><th>অভিভাবক</th><th>ফোন</th><th>ফি</th><th>Action</th></tr></thead>
        <tbody>
          ${filtered.length===0?`<tr><td colspan="9" style="text-align:center;padding:30px;color:var(--text-l)">কোনো শিক্ষার্থী পাওয়া যায়নি</td></tr>`
          :filtered.map((s,i)=>`<tr>
            <td><div style="display:flex;align-items:center;gap:8px">${avHTML(s.name,i)}<span style="font-weight:500">${s.name}</span></div></td>
            <td style="font-family:monospace;font-size:11px;color:var(--text-l)">${s.id}</td>
            <td>${s.cls} – ${s.section}</td>
            <td>${s.roll}</td>
            <td style="font-weight:700;color:${s.blood.includes('-')?'var(--red)':'var(--green)'}">${s.blood}</td>
            <td>${s.guardian}</td>
            <td><a href="tel:${s.phone}" style="color:var(--green);text-decoration:none;font-weight:500">📞 ${s.phone}</a></td>
            <td><span class="badge ${s.fee}" onclick="toggleFee('${s.id}')" style="cursor:pointer">${s.fee==='paid'?'✓ পরিশোধ':'✗ বকেয়া'}</span></td>
            <td><button class="btn-r" onclick="deleteStudent('${s.id}')">🗑</button></td>
          </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
  }

  window.setClassFilter=c=>{filter=c;draw();};
  window.toggleFee=id=>{
    const students=LS.get('students')||[];
    const s=students.find(x=>x.id===id);
    if(s){LS.update('students',id,{fee:s.fee==='paid'?'unpaid':'paid'});toast('ফি স্ট্যাটাস আপডেট হয়েছে ✅');draw();}
  };
  window.deleteStudent=id=>{
    if(confirm('এই শিক্ষার্থী মুছে ফেলবেন?')){LS.delete('students',id);toast('শিক্ষার্থী মুছে ফেলা হয়েছে','error');draw();}
  };

  document.getElementById('search-input').addEventListener('input',draw);
  draw();
}

function renderAttendance(el){
  const today=new Date().toLocaleDateString('bn-BD');
  const days=['সোম','মঙ্গল','বুধ','বৃহ','শুক্র'];
  const atKey='attendance_'+new Date().toDateString();
  let saved=LS.get(atKey)||{};

  function draw(){
    const students=LS.get('students')||[];
    el.innerHTML=`
    <div class="ph">
      <div><h2>ডিজিটাল উপস্থিতি</h2><p>তারিখ: ${today}</p></div>
      <button class="btn-p" onclick="saveAttendance()">💾 সংরক্ষণ করুন</button>
    </div>
    <div class="card">
      <div class="card-h"><h3>আজকের উপস্থিতি চিহ্নিত করুন</h3><span>${students.length} জন শিক্ষার্থী</span></div>
      <table class="tbl">
        <thead><tr><th>শিক্ষার্থী</th><th>শ্রেণী</th><th>উপস্থিত ✅</th><th>অনুপস্থিত ❌</th><th>স্ট্যাটাস</th></tr></thead>
        <tbody>
          ${students.map((s,i)=>{
            const status=saved[s.id]||'present';
            return `<tr id="att-row-${s.id}">
              <td><div style="display:flex;align-items:center;gap:8px">${avHTML(s.name,i)}<span style="font-weight:500">${s.name}</span></div></td>
              <td>${s.cls}</td>
              <td style="text-align:center"><input type="radio" name="att-${s.id}" value="present" ${status==='present'?'checked':''} onchange="setAtt('${s.id}','present')"/></td>
              <td style="text-align:center"><input type="radio" name="att-${s.id}" value="absent" ${status==='absent'?'checked':''} onchange="setAtt('${s.id}','absent')"/></td>
              <td><span class="badge ${status}" id="att-badge-${s.id}">${status==='present'?'উপস্থিত':'অনুপস্থিত'}</span></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>`;
  }

  window.setAtt=(id,val)=>{
    saved[id]=val;
    const badge=document.getElementById('att-badge-'+id);
    if(badge){badge.className='badge '+val;badge.textContent=val==='present'?'উপস্থিত':'অনুপস্থিত';}
  };
  window.saveAttendance=()=>{
    LS.set(atKey,saved);
    const pres=Object.values(saved).filter(v=>v==='present').length;
    toast(`✅ উপস্থিতি সংরক্ষিত — উপস্থিত: ${pres} জন`);
  };
  draw();
}

function renderFees(el){
  const students=LS.get('students')||[];
  const teachers=LS.get('teachers')||[];
  const paid=students.filter(s=>s.fee==='paid');
  const unpaid=students.filter(s=>s.fee==='unpaid');
  const feePerStudent=500;
  const total=students.length*feePerStudent;
  const collected=paid.length*feePerStudent;
  const due=unpaid.length*feePerStudent;
  const tSal=teachers.reduce((a,t)=>a+parseInt(t.salary||0),0);
  let tab='students';

  function draw(){
    el.innerHTML=`
    <div class="ph">
      <div><h2>আর্থিক মডিউল</h2><p>ফেব্রুয়ারি 2026</p></div>
      <button class="btn-p" onclick="printReport()">🖨️ রিপোর্ট প্রিন্ট করুন</button>
    </div>
    <div class="fee-sum">
      <div class="fee-box ft"><div class="fv">৳ ${total.toLocaleString()}</div><div class="fl" style="color:var(--green)">মোট ফি (এই মাস)</div></div>
      <div class="fee-box fc"><div class="fv">৳ ${collected.toLocaleString()}</div><div class="fl" style="color:var(--blue)">সংগৃহীত</div></div>
      <div class="fee-box fd"><div class="fv">৳ ${due.toLocaleString()}</div><div class="fl" style="color:var(--red)">বকেয়া</div></div>
    </div>
    <div class="tabs">
      <button class="tab-btn ${tab==='students'?'active':''}" onclick="setFeeTab('students')">🎒 শিক্ষার্থীর ফি</button>
      <button class="tab-btn ${tab==='teachers'?'active':''}" onclick="setFeeTab('teachers')">👩‍🏫 বেতন</button>
    </div>
    <div id="fee-table"></div>`;

    drawFeeTable();
  }

  function drawFeeTable(){
    const ft=document.getElementById('fee-table');
    if(!ft) return;
    if(tab==='students'){
      ft.innerHTML=`<div class="card"><table class="tbl">
        <thead><tr><th>শিক্ষার্থী</th><th>শ্রেণী</th><th>মাসিক ফি</th><th>মাস</th><th>স্ট্যাটাস</th><th>Action</th></tr></thead>
        <tbody>${students.map((s,i)=>`<tr>
          <td><div style="display:flex;align-items:center;gap:8px">${avHTML(s.name,i)}<span style="font-weight:500">${s.name}</span></div></td>
          <td>${s.cls}</td>
          <td style="font-weight:600">৳ ${feePerStudent}</td>
          <td>Feb 2026</td>
          <td><span class="badge ${s.fee}" style="cursor:pointer" onclick="toggleFeeStatus('${s.id}')">${s.fee==='paid'?'✓ পরিশোধ':'✗ বকেয়া'}</span></td>
          <td>${s.fee==='unpaid'?`<button onclick="sendReminder('${s.name}','${s.phone}')" style="background:var(--green-pale);color:var(--green);border:1px solid var(--border);border-radius:7px;padding:4px 8px;font-size:11px;cursor:pointer">📩 রিমাইন্ডার</button>`:'—'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`;
    } else {
      ft.innerHTML=`<div class="card">
        <div class="card-h"><h3>মোট বেতন বরাদ্দ</h3><span>৳ ${tSal.toLocaleString()}</span></div>
        <table class="tbl">
          <thead><tr><th>শিক্ষক</th><th>বিষয়</th><th>বেতন</th><th>মাস</th><th>স্ট্যাটাস</th></tr></thead>
          <tbody>${teachers.map((t,i)=>`<tr>
            <td><div style="display:flex;align-items:center;gap:8px">${avHTML(t.name,i+2)}<span style="font-weight:500">${t.name}</span></div></td>
            <td>${t.subject}</td>
            <td style="font-weight:700">৳ ${Number(t.salary).toLocaleString()}</td>
            <td>Feb 2026</td>
            <td><span class="badge ${t.status}">${t.status==='paid'?'✓ পরিশোধ':'✗ বকেয়া'}</span></td>
          </tr>`).join('')}</tbody>
        </table></div>`;
    }
  }

  window.setFeeTab=t=>{tab=t;draw();};
  window.toggleFeeStatus=id=>{
    const sts=LS.get('students')||[];
    const s=sts.find(x=>x.id===id);
    if(s){LS.update('students',id,{fee:s.fee==='paid'?'unpaid':'paid'});toast('ফি স্ট্যাটাস পরিবর্তন হয়েছে ✅');navigate('fees');}
  };
  window.sendReminder=function(name,phone){
    toast(`📩 রিমাইন্ডার পাঠানো হচ্ছে ${name} কে`);
    setTimeout(()=>{window.open(`sms:${phone}?body=প্রিয় অভিভাবক, ${name} এর ফেব্রুয়ারি 2026 মাসের ফি বকেয়া আছে। অনুগ্রহ করে দ্রুত পরিশোধ করুন। — GR-KG School`,'_self');},500);
  };
  window.printReport=function(){window.print();};
  draw();
}

window.saveNotice=function(){
  const title=document.getElementById('n-title').value.trim();
  if(!title){toast('শিরোনাম লিখুন','error');return;}
  const today=new Date();
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  LS.push('notices',{title,type:document.getElementById('n-type').value,color:document.getElementById('n-color').value,date:`${months[today.getMonth()]} ${today.getDate()}`});
  toast('নোটিশ সফলভাবে পোস্ট হয়েছে ✅');
  navigate('notices');
};

window.exportData=function(){
  const data={students:LS.get('students'),teachers:LS.get('teachers'),notices:LS.get('notices'),results:LS.get('results'),exported:new Date().toISOString()};
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='grkg-backup-'+new Date().toDateString()+'.json';
  a.click();
  toast('Data export সম্পন্ন ✅');
};
